name: Prepare Ubuntu container image (manual)
on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the validated image to GHCR (does not deploy a server)
        type: boolean
        default: false
permissions:
  contents: read
  checks: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use the same validation gates before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for required_check in validate container; do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --jq "[.check_runs[] | select(.name == \"${required_check}\" and .app.slug == \"github-actions\") | .conclusion] | first")
            test "$state" = success || { echo "The ${required_check} check must pass on this commit before preparing a release."; exit 1; }
          done
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase image reference
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: inputs.publish_image
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: ${{ inputs.publish_image }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migration
          push: ${{ inputs.publish_image }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}-migration
          provenance: true
          sbom: true
          cache-from: type=gha
